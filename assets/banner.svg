<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a13"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Dynamic Glowing Blurred Orbs (Background Atmosphere) -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" fill-opacity="0.12" filter="url(#glow)">
    <animate attributeName="cy" values="80;120;80" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="150;180;150" dur="11s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1020" cy="240" r="160" fill="#818cf8" fill-opacity="0.14" filter="url(#glow)">
    <animate attributeName="cy" values="240;190;240" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="1020;980;1020" dur="13s" repeatCount="indefinite"/>
  </circle>

  <circle cx="600" cy="30" r="100" fill="#c084fc" fill-opacity="0.1" filter="url(#glow)">
    <animate attributeName="r" values="100;130;100" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated Data / Container Flow Lines in Background -->
  <g stroke="#38bdf8" stroke-dasharray="8 12" stroke-opacity="0.3" stroke-width="1.5" fill="none">
    <path d="M 0 100 Q 300 160 600 110 T 1200 140">
      <animate attributeName="stroke-dashoffset" values="0;-200" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 280 Q 400 210 800 270 T 1200 240" stroke="#818cf8" stroke-opacity="0.25">
      <animate attributeName="stroke-dashoffset" values="0;200" dur="14s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Animated Floating OCI Container Blocks (Background accents) -->
  <g transform="translate(930, 65)">
    <rect width="52" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5">
      <animate attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="5s" repeatCount="indefinite"/>
    </rect>
    <path d="M12 14 h28 M12 21 h18 M12 28 h12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  </g>

  <g transform="translate(1010, 115)">
    <rect width="56" height="46" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.5">
      <animate attributeName="transform" type="translate" values="0,0; 0,9; 0,0" dur="6s" repeatCount="indefinite"/>
    </rect>
    <path d="M14 16 h28 M14 24 h22 M14 32 h14" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  </g>

  <g transform="translate(1090, 75)">
    <rect width="48" height="38" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.5">
      <animate attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <path d="M10 13 h28 M10 20 h16 M10 26 h10" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  </g>

  <g transform="translate(970, 175)">
    <rect width="60" height="48" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.5">
      <animate attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <path d="M14 16 h32 M14 25 h24 M14 33 h16" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  </g>

  <g transform="translate(1055, 195)">
    <rect width="50" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4">
      <animate attributeName="transform" type="translate" values="0,0; 0,7; 0,0" dur="6.5s" repeatCount="indefinite"/>
    </rect>
    <path d="M12 14 h26 M12 21 h16 M12 28 h10" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>
  </g>

  <!-- FOREGROUND CONTENT: Header, Titles, Subtitle & Badges -->
  <g transform="translate(80, 0)">
    <!-- Pill: Category Tag -->
    <g transform="translate(0, 52)">
      <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="14" cy="14" r="4.5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="18" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1">CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" fill="url(#accentGrad)" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Container Management
    </text>

    <!-- Sub-heading Title -->
    <text x="0" y="174" fill="#f8fafc" font-size="30" font-weight="700" letter-spacing="-0.2">
      &amp; Docker Utilities
    </text>

    <!-- Description / Subtitle -->
    <text x="0" y="215" fill="#94a3b8" font-size="16" font-weight="400">
      Curated guide to SaaS platforms, self-hosted web UIs, terminal monitors, registries &amp; runtimes.
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 252)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="112" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
        <text x="14" y="20" fill="#38bdf8" font-size="13" font-weight="600">⚡ Web UIs</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(122, 0)">
        <rect width="128" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
        <text x="14" y="20" fill="#818cf8" font-size="13" font-weight="600">📊 TUI Monitors</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(260, 0)">
        <rect width="144" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
        <text x="14" y="20" fill="#c084fc" font-size="13" font-weight="600">📦 OCI Registries</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(414, 0)">
        <rect width="138" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
        <text x="14" y="20" fill="#34d399" font-size="13" font-weight="600">🔄 Auto-Updaters</text>
      </g>
      <!-- Tag 5 -->
      <g transform="translate(562, 0)">
        <rect width="148" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
        <text x="14" y="20" fill="#f59e0b" font-size="13" font-weight="600">🛡️ Image Security</text>
      </g>
    </g>
  </g>
</svg>
